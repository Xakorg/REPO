<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Stick Battles</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts for chunky text -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Open+Sans:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- MAIN MENU -->
    <div id="main-menu" class="ui-layer">
        <h1 class="game-title">SUPER STICK BATTLES</h1>
        
        <div class="menu-buttons">
            <button class="menu-btn" id="btn-1p">1 PLAYER</button>
            <button class="menu-btn" id="btn-2p">2 PLAYER</button>
            <button class="menu-btn" id="btn-survival">SURVIVAL</button>
            <div class="small-btns">
                <button class="menu-btn small" id="btn-custom">SKINS</button>
                <button class="menu-btn small" id="btn-map">MAPS</button>
            </div>
        </div>
    </div>

    <!-- CUSTOMIZATION MENU -->
    <div id="custom-menu" class="ui-layer hidden">
        <h2>CUSTOMIZATION</h2>
        <div class="gold-box">Gold: <span id="custom-gold">0</span></div>
        
        <div class="custom-area">
            <div class="player-custom p1-custom">
                <h3>Player 1</h3>
                <div class="selector">
                    <button onclick="changeSkin('p1', -1)">◄</button>
                    <span id="p1-skin-name">Stickman</span>
                    <button onclick="changeSkin('p1', 1)">►</button>
                </div>
                <button class="buy-btn" id="p1-buy-btn">BUY (100g)</button>
            </div>
            
            <div class="player-custom p2-custom">
                <h3>Player 2</h3>
                <div class="selector">
                    <button onclick="changeSkin('p2', -1)">◄</button>
                    <span id="p2-skin-name">Stickman</span>
                    <button onclick="changeSkin('p2', 1)">►</button>
                </div>
                <button class="buy-btn" id="p2-buy-btn">BUY (100g)</button>
            </div>
        </div>
        
        <button class="menu-btn back-btn" onclick="showMenu('main-menu')">BACK</button>
    </div>

    <!-- PRE-MATCH LOBBY -->
    <div id="lobby-menu" class="ui-layer hidden">
        <h2>SELECT MAP</h2>
        <div class="selector">
            <button onclick="changeMap(-1)">◄</button>
            <span id="map-name">The Arena</span>
            <button onclick="changeMap(1)">►</button>
        </div>
        
        <div class="rules-box">
            <label>Mode: </label>
            <select id="rules-mode">
                <option value="deathmatch">Deathmatch</option>
                <option value="bo3">Best of 3</option>
            </select>
        </div>
        
        <button class="menu-btn start-btn" id="btn-start-match">FIGHT!</button>
        <button class="menu-btn back-btn" onclick="showMenu('main-menu')">BACK</button>
    </div>

    <!-- GAME OVERLAY -->
    <div id="game-overlay" class="ui-layer hidden">
        <div id="in-game-hud">
            <div class="hud-p1">
                <div class="health-bar"><div id="hud-p1-health" class="health-fill p1-fill"></div></div>
                <div class="super-bar"><div id="hud-p1-super" class="super-fill p1-super"></div></div>
            </div>
            <div class="hud-p2">
                <div class="health-bar"><div id="hud-p2-health" class="health-fill p2-fill"></div></div>
                <div class="super-bar"><div id="hud-p2-super" class="super-fill p2-super"></div></div>
            </div>
        </div>

        <div id="game-over-modal" class="hidden">
            <h1 id="winner-text">PLAYER WINS!</h1>
            <button id="return-menu-btn" class="menu-btn small">MENU</button>
        </div>
    </div>

    <!-- Matter.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    
    <!-- Game Scripts -->
    <script src="js/Characters.js"></script>
    <script src="js/GameManager.js"></script>
    <script src="js/Camera.js"></script>
    <script src="js/Level.js"></script>
    <script src="js/Stickman.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
