<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Stick Battles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-layer">
        <div id="health-bars">
            <div class="player-hud">
                <div class="player-name p1-name">PLAYER 1</div>
                <div class="health-bar-container">
                    <div id="p1-health" class="health-fill p1-fill"></div>
                </div>
            </div>
            <div class="player-hud">
                <div class="player-name p2-name">PLAYER 2</div>
                <div class="health-bar-container">
                    <div id="p2-health" class="health-fill p2-fill"></div>
                </div>
            </div>
        </div>

        <div id="game-over" class="hidden">
            <h1 id="winner-text">PLAYER WINS!</h1>
            <button id="restart-btn">PLAY AGAIN</button>
        </div>
        
        <div id="instructions">
            P1: WASD to Move/Attack | P2: Arrow Keys to Move/Attack
        </div>
    </div>

    <!-- Matter.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    
    <!-- Game Scripts -->
    <script src="js/Level.js"></script>
    <script src="js/Stickman.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
