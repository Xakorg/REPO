name: Xakcode Deploy to GitHub Pages
on:
  repository_dispatch:
    types: [xakcode-deploy]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build / Export
        run: |
          npm run build || true
          npm run export || true

      - name: Determine build directory
        id: builddir
        run: |
          if [ -d out ]; then echo "BUILD_DIR=out" > build_dir;
          elif [ -d .next/export ]; then echo "BUILD_DIR=.next/export" > build_dir;
          elif [ -d out_dir ]; then echo "BUILD_DIR=out_dir" > build_dir;
          elif [ -d dist ]; then echo "BUILD_DIR=dist" > build_dir;
          else echo "No build dir found" && exit 1; fi
          cat build_dir

      - name: Publish to gh-pages under deployments/<deployId>
        env:
          DEPLOY_ID: ${{ github.event.client_payload.deployId }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_DIR=$(cat build_dir | cut -d'=' -f2)
          echo "Using build dir: $BUILD_DIR"
          TARGET_DIR="deployments/$DEPLOY_ID"
          git config user.name "xakcode-bot"
          git config user.email "xakcode-bot@users.noreply.github.com"

          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
            git commit --allow-empty -m "Initialize gh-pages" || true
            git push origin gh-pages || true
          fi

          mkdir -p $TARGET_DIR
          rm -rf $TARGET_DIR/* || true
          cp -r $BUILD_DIR/* $TARGET_DIR/ || true

          git add -A
          git commit -m "Xakcode deploy $DEPLOY_ID" || echo "No changes to commit"
          git push origin gh-pages
